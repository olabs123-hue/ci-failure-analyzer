name: Python tests and evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate labelled fixture
        run: python -m ci_analyzer.cli evaluate examples/labeled_logs.json
      - name: Detect flaky tests
        run: python -m ci_analyzer.cli flaky examples/test_runs.json
